<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формула Спортивного Успеха 🚴‍♂️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');
        body { 
            font-family: 'Inter', system_ui, sans-serif; 
        }
        .log-font { 
            font-family: 'Roboto Mono', monospace; 
        }
        .product-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-btn:hover {
            transform: translateY(-4px) scale(1.05);
        }
        .modal {
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
            <div class="px-4 sm:px-8 py-5 sm:py-6 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 bg-orange-500 rounded-2xl flex items-center justify-center text-3xl">🚴‍♂️</div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight">Формула Спортивного Успеха</h1>
                        <p class="text-gray-500 text-sm">Учёт продаж</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-3 w-full sm:w-auto">
                    <button onclick="switchTab(0)" id="tab-sales" 
                            class="tab-btn flex-1 sm:flex-none px-5 py-3 rounded-2xl font-medium flex items-center justify-center gap-2 active bg-gray-900 text-white">
                        <i class="fas fa-cash-register"></i>
                        <span>Продажи</span>
                    </button>
                    <button onclick="switchTab(1)" id="tab-report" 
                            class="tab-btn flex-1 sm:flex-none px-5 py-3 rounded-2xl font-medium flex items-center justify-center gap-2">
                        <i class="fas fa-chart-bar"></i>
                        <span>Отчёт</span>
                    </button>
                    <button onclick="resetDatabase()" 
                            class="px-5 py-3 text-red-600 hover:bg-red-50 rounded-2xl flex items-center gap-2 text-sm font-medium border border-red-200">
                        <i class="fas fa-trash"></i>
                        <span class="hidden sm:inline">Сбросить данные</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="p-4 sm:p-8">
            <!-- SALES TAB -->
            <div id="sales-tab" class="tab-content">
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-4 mb-10" id="products-grid"></div>

                <!-- Quick Totals -->
                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 mb-8">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-6">
                        <div>
                            <div class="text-sm text-gray-500">ОБЩАЯ ВЫРУЧКА</div>
                            <div id="total-sales" class="text-4xl sm:text-5xl font-semibold text-emerald-600">0 ₽</div>
                        </div>
                        <div class="grid grid-cols-3 gap-6 sm:gap-8 text-center w-full sm:w-auto">
                            <div>
                                <div class="text-xs text-gray-500">НАЛИЧНЫЕ</div>
                                <div id="total-cash" class="font-semibold text-lg">0 ₽</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">ПЕРЕВОД</div>
                                <div id="total-transfer" class="font-semibold text-lg">0 ₽</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">QR КОД</div>
                                <div id="total-qr" class="font-semibold text-lg">0 ₽</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Log -->
                <div class="bg-white rounded-3xl shadow-sm border border-gray-100">
                    <div class="px-6 py-5 border-b flex items-center justify-between">
                        <h2 class="font-semibold text-lg flex items-center gap-3">
                            <i class="fas fa-list"></i>
                            История продаж
                        </h2>
                        <button onclick="clearLog()" class="text-xs px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-gray-600 flex items-center gap-1">
                            <i class="fas fa-broom"></i>
                            <span class="hidden sm:inline">Очистить</span>
                        </button>
                    </div>
                    <div id="sales-log" class="max-h-[380px] sm:max-h-[420px] overflow-auto p-5 sm:p-6 space-y-3 text-sm log-font"></div>
                </div>
            </div>

            <!-- REPORT TAB -->
            <div id="report-tab" class="tab-content hidden">
                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm">
                    <h2 class="text-2xl font-semibold mb-8 flex items-center gap-3">
                        <i class="fas fa-file-invoice"></i>
                        Подробный отчёт
                    </h2>
                    <div id="report-content" class="space-y-8"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[100] p-4">
        <div class="modal bg-white rounded-3xl max-w-md w-full shadow-2xl">
            <div class="px-6 sm:px-8 pt-8 pb-6">
                <div class="flex items-center justify-between mb-6">
                    <div id="modal-product-name" class="text-2xl font-semibold"></div>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                
                <div id="modal-price-display" class="text-4xl font-bold text-emerald-600 mb-8"></div>

                <div id="special-price-area" class="hidden mb-8">
                    <div class="flex gap-3" id="bubbles-prices"></div>
                    <div class="mt-4">
                        <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Другая сумма</label>
                        <div class="flex">
                            <input id="custom-price" type="number" 
                                   class="flex-1 border border-gray-300 focus:border-emerald-500 rounded-l-2xl px-5 py-4 text-2xl outline-none" 
                                   placeholder="Сумма">
                            <button onclick="confirmCustomPrice()" 
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 rounded-r-2xl font-medium">OK</button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4" id="payment-methods"></div>
            </div>
            
            <div class="border-t px-6 sm:px-8 py-6 flex justify-end">
                <button onclick="closeModal()" class="px-8 py-3 text-gray-500 hover:bg-gray-100 rounded-2xl">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 'vata', name: 'Вата', emoji: '🍭', price: 150, fixed: true },
            { id: 'milkshake', name: 'Молочные коктели', emoji: '🧋', price: 150, fixed: true },
            { id: 'mohito', name: 'Мохито', emoji: '🍹', price: 150, fixed: true },
            { id: 'corn', name: 'Кукуруза', emoji: '🌽', price: 200, fixed: true },
            { id: 'water', name: 'Вода', emoji: '🥤', price: 50, fixed: true },
            { id: 'juice', name: 'Сок', emoji: '🧃', price: 40, fixed: true },
            { id: 'napkins', name: 'Салфетки', emoji: '🧼', price: 70, fixed: true },
            { id: 'bubbles', name: 'Пузыри', emoji: '🧫', price: null, fixed: false },
            { id: 'toy', name: 'Игрушки', emoji: '🧸', price: null, fixed: false }
        ];

        let db;
        let currentProduct = null;
        let currentPrice = 0;

        function initDB() {
            const request = indexedDB.open('SalesDB', 1);
            request.onupgradeneeded = function(event) {
                db = event.target.result;
                if (!db.objectStoreNames.contains('sales')) {
                    db.createObjectStore('sales', { keyPath: 'id', autoIncrement: true });
                }
            };
            request.onsuccess = function(event) {
                db = event.target.result;
                loadAllData();
            };
            request.onerror = function(event) {
                console.error('IndexedDB error:', event.target.error);
            };
        }

        function addSale(productName, price, paymentMethod) {
            const timestamp = new Date();
            const sale = {
                timestamp: timestamp.toISOString(),
                product: productName,
                price: parseFloat(price),
                payment: paymentMethod,
                displayTime: timestamp.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' • ' + 
                              timestamp.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'})
            };
            
            const transaction = db.transaction(['sales'], 'readwrite');
            const store = transaction.objectStore('sales');
            store.add(sale);
            
            transaction.oncomplete = () => {
                loadAllData();
            };
        }

        function loadAllData() {
            if (!db) return;
            const transaction = db.transaction(['sales'], 'readonly');
            const store = transaction.objectStore('sales');
            const request = store.getAll();
            request.onsuccess = function() {
                const sales = request.result;
                renderLog(sales);
                renderTotals(sales);
                renderReport(sales);
            };
        }

        function renderLog(sales) {
            const logContainer = document.getElementById('sales-log');
            logContainer.innerHTML = '';
            if (sales.length === 0) {
                logContainer.innerHTML = `<div class="text-center py-12 text-gray-400">Пока нет продаж</div>`;
                return;
            }
            sales.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            sales.forEach(sale => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-gray-50 hover:bg-gray-100 p-4 rounded-2xl';
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="text-xl">${getProductEmoji(sale.product)}</span>
                        <div>
                            <div class="font-medium">${sale.product}</div>
                            <div class="text-xs text-gray-500">${sale.displayTime}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-semibold text-emerald-600">+${sale.price} ₽</div>
                        <div class="text-xs text-gray-500">${sale.payment}</div>
                    </div>
                `;
                logContainer.appendChild(div);
            });
        }

        function getProductEmoji(productName) {
            const prod = products.find(p => p.name === productName);
            return prod ? prod.emoji : '🛒';
        }

        function renderTotals(sales) {
            let total = 0;
            let cash = 0;
            let transfer = 0;
            let qr = 0;
            sales.forEach(s => {
                total += s.price;
                if (s.payment === 'Наличные') cash += s.price;
                else if (s.payment === 'Перевод') transfer += s.price;
                else if (s.payment === 'QR код') qr += s.price;
            });
            document.getElementById('total-sales').textContent = total.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('total-cash').textContent = cash.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('total-transfer').textContent = transfer.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('total-qr').textContent = qr.toLocaleString('ru-RU') + ' ₽';
        }

        function renderReport(sales) {
            const container = document.getElementById('report-content');
            container.innerHTML = '';
            const byProduct = {};
            sales.forEach(sale => {
                if (!byProduct[sale.product]) {
                    byProduct[sale.product] = { cash: 0, transfer: 0, qr: 0, total: 0 };
                }
                byProduct[sale.product].total += sale.price;
                if (sale.payment === 'Наличные') byProduct[sale.product].cash += sale.price;
                else if (sale.payment === 'Перевод') byProduct[sale.product].transfer += sale.price;
                else if (sale.payment === 'QR код') byProduct[sale.product].qr += sale.price;
            });

            products.forEach(product => {
                const data = byProduct[product.name] || { cash: 0, transfer: 0, qr: 0, total: 0 };
                const div = document.createElement('div');
                div.className = 'border border-gray-100 rounded-3xl p-6';
                div.innerHTML = `
                    <div class="flex items-center gap-4 mb-6">
                        <span class="text-4xl">${product.emoji}</span>
                        <div class="font-semibold text-xl">${product.name}</div>
                    </div>
                    <div class="space-y-4 text-sm">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-500">Наличными</span>
                            <span class="font-medium">${data.cash} ₽</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-500">Перевод</span>
                            <span class="font-medium">${data.transfer} ₽</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-500">QR код</span>
                            <span class="font-medium">${data.qr} ₽</span>
                        </div>
                        <div class="flex justify-between border-t pt-4 font-semibold">
                            <span>Общая сумма</span>
                            <span class="text-emerald-600">${data.total} ₽</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            let grandCash = 0, grandTransfer = 0, grandQR = 0, grandTotal = 0;
            sales.forEach(s => {
                grandTotal += s.price;
                if (s.payment === 'Наличные') grandCash += s.price;
                else if (s.payment === 'Перевод') grandTransfer += s.price;
                else if (s.payment === 'QR код') grandQR += s.price;
            });

            const totalDiv = document.createElement('div');
            totalDiv.className = 'bg-emerald-50 border border-emerald-100 rounded-3xl p-8';
            totalDiv.innerHTML = `
                <div class="text-xl font-semibold mb-6">Общая сумма по всем товарам</div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 text-center">
                    <div>
                        <div class="text-xs text-emerald-700/70">НАЛИЧНЫЕ</div>
                        <div class="text-3xl font-semibold text-emerald-700">${grandCash} ₽</div>
                    </div>
                    <div>
                        <div class="text-xs text-emerald-700/70">ПЕРЕВОД</div>
                        <div class="text-3xl font-semibold text-emerald-700">${grandTransfer} ₽</div>
                    </div>
                    <div>
                        <div class="text-xs text-emerald-700/70">QR КОД</div>
                        <div class="text-3xl font-semibold text-emerald-700">${grandQR} ₽</div>
                    </div>
                    <div class="sm:border-l border-emerald-200 sm:pl-8">
                        <div class="text-xs text-emerald-700/70">ВСЕГО</div>
                        <div class="text-4xl font-bold text-emerald-700">${grandTotal} ₽</div>
                    </div>
                </div>
            `;
            container.appendChild(totalDiv);
        }

        function createProductButtons() {
            const container = document.getElementById('products-grid');
            container.innerHTML = '';
            products.forEach(product => {
                const btn = document.createElement('button');
                btn.className = `product-btn bg-white border border-gray-200 hover:border-orange-300 h-36 sm:h-40 flex flex-col items-center justify-center rounded-3xl shadow-sm`;
                btn.innerHTML = `
                    <div class="text-5xl sm:text-6xl mb-3">${product.emoji}</div>
                    <div class="font-semibold text-base sm:text-lg text-center px-2">${product.name}</div>
                    ${product.fixed && product.price ? `<div class="text-sm text-gray-500 mt-1">${product.price} ₽</div>` : ''}
                `;
                btn.onclick = () => openPaymentModal(product);
                container.appendChild(btn);
            });
        }

        function openPaymentModal(product) {
            currentProduct = product;
            document.getElementById('modal-product-name').innerHTML = `${product.emoji} ${product.name}`;
            const priceArea = document.getElementById('special-price-area');
            const priceDisplay = document.getElementById('modal-price-display');
            
            if (product.fixed) {
                currentPrice = product.price;
                priceDisplay.textContent = `${product.price} ₽`;
                priceDisplay.classList.remove('hidden');
                priceArea.classList.add('hidden');
            } else {
                priceDisplay.classList.add('hidden');
                priceArea.classList.remove('hidden');
                if (product.id === 'bubbles') {
                    const bubblesDiv = document.getElementById('bubbles-prices');
                    bubblesDiv.innerHTML = `
                        <button onclick="selectBubblePrice(100)" class="flex-1 py-6 bg-white border border-gray-200 hover:border-violet-400 rounded-2xl font-medium">100 ₽</button>
                        <button onclick="selectBubblePrice(150)" class="flex-1 py-6 bg-white border border-gray-200 hover:border-violet-400 rounded-2xl font-medium">150 ₽</button>
                    `;
                }
            }
            
            const methodsContainer = document.getElementById('payment-methods');
            methodsContainer.innerHTML = `
                <button onclick="confirmPayment('Наличные')" class="col-span-1 py-8 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-3xl flex flex-col items-center gap-3">
                    <i class="fas fa-money-bill-wave text-4xl text-emerald-600"></i>
                    <div class="font-semibold">Наличные</div>
                </button>
                <button onclick="confirmPayment('Перевод')" class="col-span-1 py-8 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-3xl flex flex-col items-center gap-3">
                    <i class="fas fa-mobile-alt text-4xl text-blue-600"></i>
                    <div class="font-semibold">Перевод</div>
                </button>
                <button onclick="confirmPayment('QR код')" class="col-span-1 py-8 bg-purple-50 hover:bg-purple-100 border border-purple-200 rounded-3xl flex flex-col items-center gap-3">
                    <i class="fas fa-qrcode text-4xl text-purple-600"></i>
                    <div class="font-semibold">QR код</div>
                </button>
            `;
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function selectBubblePrice(price) {
            currentPrice = price;
            document.getElementById('modal-price-display').textContent = `${price} ₽`;
            document.getElementById('modal-price-display').classList.remove('hidden');
        }

        function confirmCustomPrice() {
            const input = document.getElementById('custom-price');
            const val = parseFloat(input.value);
            if (isNaN(val) || val <= 0) {
                alert('Введите корректную сумму');
                return;
            }
            currentPrice = val;
            document.getElementById('modal-price-display').textContent = `${val} ₽`;
            document.getElementById('modal-price-display').classList.remove('hidden');
        }

        function confirmPayment(method) {
            if (!currentPrice || currentPrice <= 0) {
                alert('Укажите сумму продажи');
                return;
            }
            addSale(currentProduct.name, currentPrice, method);
            closeModal();
            showToast(`Продажа ${currentProduct.name} на ${currentPrice} ₽ записана!`);
        }

        function closeModal() {
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('custom-price').value = '';
            currentPrice = 0;
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111; color:white; padding:14px 22px; border-radius:9999px; box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.3); z-index:1000; font-size:15px;';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'all 0.3s';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active', 'bg-gray-900', 'text-white'));
            
            if (tab === 0) {
                document.getElementById('sales-tab').classList.remove('hidden');
                document.getElementById('tab-sales').classList.add('active', 'bg-gray-900', 'text-white');
            } else {
                document.getElementById('report-tab').classList.remove('hidden');
                document.getElementById('tab-report').classList.add('active', 'bg-gray-900', 'text-white');
                loadAllData();
            }
        }

        function resetDatabase() {
            if (!confirm('Вы уверены, что хотите сбросить ВСЕ данные?')) return;
            const transaction = db.transaction(['sales'], 'readwrite');
            const store = transaction.objectStore('sales');
            store.clear();
            transaction.oncomplete = () => {
                loadAllData();
                showToast('Данные успешно сброшены');
            };
        }

        function clearLog() {
            if (!confirm('Очистить историю продаж?')) return;
            resetDatabase();
        }

        window.onload = function() {
            initDB();
            createProductButtons();
            switchTab(0);
        };
    </script>
</body>
</html>
